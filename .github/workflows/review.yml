name: review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codebleach-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same-repository, non-Dependabot PRs only. Fork and Dependabot jobs get a
    # read-only token (and no secrets), so skip before any secret use.
    if: >-
      github.event.pull_request.head.repo != null &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head object (Git data only, never checked out)
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies (trusted base tree only)
        run: bun install --frozen-lockfile
      - name: Run CodeBleach review and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CODEBLEACH_ALLOW_MUSE_SPARK_TRAINING: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEBLEACH_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEBLEACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CODEBLEACH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun run src/cli/index.ts review \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo . \
            --out .reviewer-out
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codebleach-run-${{ github.event.pull_request.number }}
          path: .reviewer-out/
          retention-days: 7
          if-no-files-found: warn
